<!DOCTYPE html>
<html lang="en" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AL MUSTAQBAL PS4 HOST</title>
<style>
  * { box-sizing:border-box; }
  html, body {
    margin:0; padding:0; min-height:100%;
    background:#020817;
    color:#eef6ff;
    font:15px/1.5 "Segoe UI", Tahoma, Arial, sans-serif;
  }
  body {
    min-height:100vh;
    background:
      radial-gradient(circle at 50% 18%, rgba(0,174,255,.16) 0, rgba(0,174,255,0) 34%),
      radial-gradient(circle at 10% 85%, rgba(22,86,255,.12) 0, rgba(22,86,255,0) 28%),
      linear-gradient(180deg,#03111f 0%,#020817 55%,#01040b 100%);
  }
  #brand {
    min-height:76px;
    padding:14px 34px;
    border-bottom:1px solid #12324d;
    background:rgba(2,10,22,.96);
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .brand-left { display:flex; align-items:center; }
  .brand-mark {
    width:46px; height:46px;
    border:2px solid #22b7ff;
    background:linear-gradient(135deg,#092b47,#04111f);
    box-shadow:0 0 24px rgba(34,183,255,.24);
    display:flex; align-items:center; justify-content:center;
    margin-right:13px;
    transform:rotate(45deg);
  }
  .brand-mark span {
    display:block;
    color:#ffffff;
    font-size:23px;
    font-weight:900;
    transform:rotate(-45deg);
    text-shadow:0 0 12px rgba(34,183,255,.55);
  }
  .brand-copy { line-height:1.08; }
  .brand-copy b {
    display:block;
    font-size:18px;
    letter-spacing:.12em;
    color:#ffffff;
  }
  .brand-copy small {
    display:block;
    margin-top:6px;
    font-size:13px;
    color:#5fc9ff;
    direction:rtl;
  }
  .host-badge {
    border:1px solid #1f5275;
    background:#071a2b;
    color:#8edcff;
    padding:7px 12px;
    border-radius:18px;
    font-size:11px;
    font-weight:700;
    letter-spacing:.12em;
  }
  #hero {
    text-align:center;
    padding:58px 20px 24px;
  }
  #hero .eyebrow {
    color:#45c5ff;
    font-size:12px;
    font-weight:700;
    letter-spacing:.28em;
    margin-bottom:8px;
  }
  #hero h1 {
    margin:0;
    font-size:42px;
    line-height:1.1;
    letter-spacing:.035em;
    color:#ffffff;
    text-shadow:0 0 26px rgba(38,181,255,.16);
  }
  #hero h1 span { color:#36bfff; }
  #hero p {
    margin:12px 0 0;
    color:#8ea8bc;
    font-size:14px;
  }
  #wrap {
    width:calc(100% - 36px);
    max-width:780px;
    margin:0 auto;
    padding:22px 24px;
    border:1px solid #153b59;
    border-radius:14px;
    background:linear-gradient(180deg,rgba(8,27,45,.95),rgba(4,15,28,.95));
    box-shadow:0 18px 60px rgba(0,0,0,.32), inset 0 1px 0 rgba(255,255,255,.025);
    text-align:center;
  }
  #state {
    font-size:24px;
    font-weight:800;
    margin:0 0 7px;
    color:#f5fbff;
  }
  #det {
    font-size:13px;
    color:#8ea8bc;
    margin:0 0 5px;
  }
  #det b { color:#61ceff; font-weight:700; }
  #cache {
    font-size:12px;
    color:#647b8f;
    margin:0;
    min-height:18px;
  }
  #cache.cacheok { color:#61e5a5; }
  .ok { color:#61e5a5; }
  .bad { color:#ff7e84; }
  .warn { color:#ffd166; }
  #store {
    width:calc(100% - 36px);
    max-width:980px;
    margin:30px auto 0;
    padding:17px 20px 20px;
    border-top:1px solid #12324d;
    text-align:center;
    color:#8298aa;
    font-size:12px;
    direction:rtl;
  }
  #store b {
    display:block;
    color:#dcecff;
    margin-bottom:4px;
    font-size:13px;
  }
  #store .phones {
    direction:ltr;
    display:inline-block;
    margin-top:5px;
    color:#46c5ff;
    font-weight:700;
    letter-spacing:.05em;
  }
  @media (max-width:700px) {
    #brand { padding:12px 16px; }
    .host-badge { display:none; }
    #hero { padding-top:38px; }
    #hero h1 { font-size:30px; }
    #wrap { padding:20px 14px; }
    #state { font-size:20px; }
  }
</style>
</head>
<body>
<div id="brand">
  <div class="brand-left">
    <div class="brand-mark"><span>M</span></div>
    <div class="brand-copy"><b>AL MUSTAQBAL</b><small>المستقبل للهاتف</small></div>
  </div>
  <div class="host-badge">PS4 HOST • AL MUSTAQBAL</div>
</div>
<div id="hero">
  <div class="eyebrow">PLAY BEYOND LIMITS</div>
  <h1>AL MUSTAQBAL <span>PS4 HOST</span></h1>
  <p>Automatic Detection • Offline Ready • Stable Experience</p>
</div>
<div id="wrap">
  <div id="state">detecting firmware...</div>
  <div id="det"></div>
  <div id="cache"></div>
</div>
<div id="store">
  <b>المستقبل للهاتف • اليمن - عدن - شارع التسعين - محطة المستقبل - مقابل فندق دار التوحيد</b>
  <span class="phones">776330635 &nbsp; • &nbsp; 770299356</span>
</div>

<script>
(function () {
    var stateEl = document.getElementById("state");
    var detEl = document.getElementById("det");
    var cacheEl = document.getElementById("cache");
    function setState(t, c) { stateEl.textContent = t; stateEl.className = c || ""; }
    function setCache(t, ok) { cacheEl.textContent = t; cacheEl.className = ok ? "cacheok" : ""; }
    var params = new URLSearchParams(location.search);

    // Firmwares this build has a MEASURED kernel table for. jb.js still runs its
    // own kernel-table-present gate, so this is UX only -- an unlisted firmware
    // can still be launched with a tap. KEEP IN SYNC with ps4_offsets.js: add a
    // fwnum here in the SAME commit that fills that firmware's kernel RVAs.
    // The PS4 reports its minor as two hex digits in the UA (13.52 -> minor 0x52).
    var SUPPORTED = { 1302: 1, 1304: 1, 1350: 1, 1352: 1 }; // all measured on hardware

    var key = null, fwnum = null;
    var m = /PlayStation\s+4[\/ ](\d+)\.(\d+)/.exec(navigator.userAgent);
    if (m) {
        var ms = parseInt(m[2], 16).toString(16);
        if (ms.length < 2) ms = "0" + ms;
        key = m[1] + "." + ms;
        fwnum = parseInt(m[1], 10) * 100 + parseInt(ms, 10);
    }

    var forced = params.get("force") === "1";
    var supported = forced || (fwnum !== null && SUPPORTED[fwnum] === 1);
    detEl.innerHTML = "firmware <b>" + (key || "unknown") + "</b>"
        + (supported ? " &middot; <b>supported</b>"
                     : " &middot; not in this build's kernel table");

    var target = "jb.html" + location.search;
    function go() { setState("loading jailbreak...", "warn"); location.replace(target); }

    function waitForTap(msg, action) {
        setState(msg, "warn");
        function fire() {
            window.removeEventListener("click", fire);
            window.removeEventListener("keydown", fire);
            action();
        }
        window.addEventListener("click", fire);
        window.addEventListener("keydown", fire);
    }

    // Off-target consoles are not launched automatically -- one tap still runs
    // it, so a user-agent quirk on the real 13.52 console can never lock it out.
    if (!supported) {
        setState("UNSUPPORTED FIRMWARE", "bad");
        waitForTap("UNSUPPORTED (" + (key || "unknown") + ") -- press X or tap to run anyway", go);
        return;
    }

    var ac = window.applicationCache;
    if (!ac || !document.documentElement.hasAttribute("manifest")) {
        go();
    } else if (!navigator.onLine) {
        setCache("offline -- from cache", true);
        go();
    } else if (ac.status === ac.IDLE) {
        setCache("cached", true);
        go();
    } else if (ac.status === ac.UPDATEREADY) {
        try { ac.swapCache(); } catch (e) {}
        setCache("update downloaded", true);
        waitForTap("UPDATE READY -- press X or tap to reload & run",
                   function () { location.reload(); });
    } else {
        setCache("checking cache...");
        ac.addEventListener("downloading",
            function () { setCache("caching for offline (first run)..."); }, false);
        ac.addEventListener("progress", function (e) {
            if (e && e.total)
                setCache("caching " + Math.round((e.loaded / e.total) * 100) + "%");
        }, false);
        ac.addEventListener("cached", function () {
            setCache("cached for offline use", true);
            waitForTap("CACHED (first run) -- press X or tap to run", go);
        }, false);
        ac.addEventListener("updateready", function () {
            try { ac.swapCache(); } catch (e) {}
            setCache("update downloaded", true);
            waitForTap("UPDATE READY -- press X or tap to reload & run",
                       function () { location.reload(); });
        }, false);
        ac.addEventListener("noupdate", function () {
            setCache("cached -- offline ready", true);
            go();
        }, false);
        ac.addEventListener("error", function () {
            setCache("cache unavailable");
            waitForTap("CACHE FAILED -- press X or tap to run anyway", go);
        }, false);
        ac.addEventListener("obsolete", function () {
            setCache("cache obsolete");
            waitForTap("CACHE OBSOLETE -- press X or tap to run", go);
        }, false);
    }
})();
</script>
</body>
</html>
