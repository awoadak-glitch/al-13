<!doctype html>
<html lang="en" manifest="cache.appcache">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>AL MUSTAQBAL PS4 HOST</title>
    <style>
      * { box-sizing:border-box; }
      html, body {
        margin:0;
        padding:0;
        min-height:100%;
        background:#020817;
        color:#eef6ff;
        font:15px/1.5 "Segoe UI", Tahoma, Arial, sans-serif;
      }
      body {
        min-height:100vh;
        background:
          radial-gradient(circle at 50% 42%, rgba(0,174,255,.15) 0, rgba(0,174,255,0) 30%),
          linear-gradient(180deg,#03111f 0%,#020817 58%,#01040b 100%);
      }
      #brand {
        min-height:76px;
        padding:14px 34px;
        border-bottom:1px solid #12324d;
        background:rgba(2,10,22,.97);
        display:flex;
        align-items:center;
        justify-content:space-between;
      }
      .brand-left { display:flex; align-items:center; }
      .brand-mark {
        width:46px; height:46px;
        border:2px solid #22b7ff;
        background:linear-gradient(135deg,#092b47,#04111f);
        box-shadow:0 0 24px rgba(34,183,255,.24);
        display:flex; align-items:center; justify-content:center;
        margin-right:13px;
        transform:rotate(45deg);
      }
      .brand-mark span {
        display:block;
        color:#ffffff;
        font-size:23px;
        font-weight:900;
        transform:rotate(-45deg);
        text-shadow:0 0 12px rgba(34,183,255,.55);
      }
      .brand-copy { line-height:1.08; }
      .brand-copy b {
        display:block;
        font-size:18px;
        letter-spacing:.12em;
        color:#ffffff;
      }
      .brand-copy small {
        display:block;
        margin-top:6px;
        font-size:13px;
        color:#5fc9ff;
        direction:rtl;
      }
      .host-badge {
        border:1px solid #1f5275;
        background:#071a2b;
        color:#8edcff;
        padding:7px 12px;
        border-radius:18px;
        font-size:11px;
        font-weight:700;
        letter-spacing:.12em;
      }

      /* running state; jb.js still controls body.done / body.fail / body.log exactly as before */
      #spin {
        position:fixed;
        top:48%;
        left:50%;
        width:58px;
        height:58px;
        margin:-29px 0 0 -29px;
        border:4px solid #14334d;
        border-top-color:#39c5ff;
        border-right-color:#39c5ff;
        border-radius:50%;
        box-shadow:0 0 28px rgba(57,197,255,.16);
        animation:spin .85s linear infinite;
      }
      #spin:after {
        content:"";
        position:absolute;
        left:8px; top:8px; right:8px; bottom:8px;
        border:2px solid #0b2237;
        border-bottom-color:#61e5a5;
        border-radius:50%;
      }
      @keyframes spin { to { transform:rotate(360deg); } }
      #loaderTitle {
        position:fixed;
        top:calc(48% + 48px);
        left:0;
        right:0;
        text-align:center;
        color:#d9eeff;
        font-size:14px;
        font-weight:700;
        letter-spacing:.08em;
      }
      #loaderTitle small {
        display:block;
        margin-top:7px;
        color:#5f829c;
        font-size:11px;
        font-weight:400;
        letter-spacing:.04em;
      }
      #msg {
        position:fixed;
        top:48%;
        left:20px;
        right:20px;
        transform:translateY(-50%);
        text-align:center;
        font-size:19px;
        font-weight:700;
        color:#ff9095;
        display:none;
        direction:rtl;
      }
      #wrap { padding:0; }
      #state, #out { display:none; }

      body.done #spin,
      body.done #loaderTitle,
      body.fail #spin,
      body.fail #loaderTitle { display:none; }
      body.fail #msg { display:block; }

      /* ?log=1 keeps the same diagnostic behavior, only restyled */
      body.log #spin,
      body.log #loaderTitle,
      body.log #msg { display:none; }
      body.log #wrap { padding:22px 28px 92px; }
      body.log #state {
        display:block;
        font-size:22px;
        font-weight:800;
        margin:0 0 10px;
      }
      body.log #out {
        display:block;
        white-space:pre-wrap;
        font:12px/1.5 Consolas, monospace;
        color:#bcd0df;
        background:#05111f;
        border:1px solid #153b59;
        border-radius:10px;
        padding:13px 15px;
        height:calc(100vh - 218px);
        overflow-y:auto;
        box-shadow:inset 0 1px 0 rgba(255,255,255,.02);
      }
      .ok,.safe { color:#61e5a5; }
      .bad,.danger { color:#ff7e84; }
      .warn { color:#ffd166; }
      code { color:#8edcff; }
      #store {
        position:fixed;
        left:0;
        right:0;
        bottom:0;
        min-height:62px;
        padding:11px 20px 10px;
        border-top:1px solid #12324d;
        background:rgba(2,9,18,.97);
        text-align:center;
        color:#7892a6;
        font-size:11px;
        direction:rtl;
      }
      #store b {
        color:#dcecff;
        font-size:12px;
      }
      #store .phones {
        direction:ltr;
        display:inline-block;
        margin-right:10px;
        color:#46c5ff;
        font-weight:700;
        letter-spacing:.05em;
      }
      @media (max-width:700px) {
        #brand { padding:12px 16px; }
        .host-badge { display:none; }
        #loaderTitle { font-size:12px; }
        body.log #wrap { padding:16px 14px 88px; }
      }
    </style>
  </head>
  <body>
    <div id="brand">
      <div class="brand-left">
        <div class="brand-mark"><span>M</span></div>
        <div class="brand-copy"><b>AL MUSTAQBAL</b><small>المستقبل للهاتف</small></div>
      </div>
      <div class="host-badge">PS4 HOST • AL MUSTAQBAL</div>
    </div>
    <div id="spin"></div>
    <div id="loaderTitle">AL MUSTAQBAL PS4 HOST<small>Preparing exploit environment...</small></div>
    <div id="msg">أعد تشغيل جهاز PS4 ثم حاول مرة أخرى</div>
    <div id="wrap">
      <div id="state"></div>
      <div id="out"></div>
    </div>
    <div id="store">
      <b>المستقبل للهاتف • اليمن - عدن - شارع التسعين - محطة المستقبل - مقابل فندق دار التوحيد</b>
      <span class="phones">776330635 • 770299356</span>
    </div>
    <script type="module">
      import "./jb.js?v=10";
    </script>
  </body>
</html>
